[package]
name = "trolllauncher-native"
version = "2.2.0"
edition.workspace = true
description = "TrollLauncher — нативный интерфейс на Rust (egui) поверх движка theseus"

build = "build.rs"

[[bin]]
name = "trolllauncher-rs"
path = "src/main.rs"

[dependencies]
tempfile = { workspace = true }
theseus = { workspace = true }
daedalus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "net", "io-util"] }
eframe = "0.37"
egui_extras = { version = "0.37", features = ["image", "file", "http", "gif", "webp", "svg"] }
image = { workspace = true, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
wry = "0.56"
tao = "0.36"
pulldown-cmark = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
zstd = "0.13"
ttf-parser = "0.25"
memmap2 = "0.9"
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[build-dependencies]
winresource = "0.1"
